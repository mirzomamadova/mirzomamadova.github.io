 ${studyList?overview:card}<div class="lesson-footer"><button class="link-btn" data-action="grammar">Что такое V1, V2 и V3?</button>${!studyList&&position<9?`<button class="link-btn" data-action="start" data-day="${day}">Уже знаю → к заданиям</button>`:''}</div></div>`;
}

function grammarDetails(){return`<details class="definition"><summary>Напомнить, какую форму требует конструкция</summary><p><strong>V1</strong> — исходная форма без to. После did / didn’t в Past Simple снова нужна V1.</p><p><strong>V2</strong> — для утвердительного предложения в Past Simple: I wrote yesterday.</p><p><strong>V3</strong> — причастие. В этих заданиях оно стоит после have / has: I have written. Само have / has уже дано.</p></details>`}
function task(id,kind,field=null,extra={}){return{id,kind,field,attempt:0,...extra}}
function buildLearning(day){const ids=dayVerbs(day).map(v=>v.id);return[...shuffle(ids).map(id=>task(id,'triple')),...shuffle(ids).map(id=>task(id,'single',byId[id].contextForm===2?2:1)),...shuffle(ids).map(id=>task(id,'context',byId[id].contextForm-1))]}
function startSession(type,day,ids){
 if(state.session){navigate('session');notify('Сначала продолжи начатое занятие.');return}
 const pool=ids||dayVerbs(day).map(v=>v.id);
 state.session={type,day:day||null,pool,queue:type==='learn'?buildLearning(day):type==='repair'?shuffle(pool).map(id=>task(id,'triple')):shuffle(pool).map(id=>task(id,'test')),index:0,answers:[],feedback:null,draft:[],mistakes:[],phase:type==='learn'?'practice':type==='repair'?'repair':'test',started:today()};navigate('session');
}
function stageName(q){return{triple:'Восстанови тройку',single:'Вспомни отдельную форму',context:'Вставь форму в предложение',test:'Проверка по памяти'}[q.kind]}
function normalize(s){return String(s).trim().toLowerCase().replace(/[.。]+$/,'').replace(/\s+/g,' ')}
function answerMatches(value,v,field){
 const n=normalize(value);if(!n)return false;
 const allowed=[...v.forms[field],...(v.alts?.[field]||[])].map(normalize);
 const bits=n.split(/\s*(?:\/|,|;|\bor\b|\band\b|\bи\b)\s*/).flatMap(x=>x.split(/\s+/)).filter(Boolean);
 if(v.id==='be'&&field===1)return bits.length===2&&new Set(bits).size===2&&bits.includes('was')&&bits.includes('were');
 return bits.length>0&&bits.every(x=>allowed.includes(x));
}
function fieldLabel(v,field){return 'V'+(field+1)}
function expectedFields(q){return(q.kind==='triple'||q.kind==='test')?[0,1,2]:[q.field]}
function renderSession(){
 const s=state.session;if(!s){view='today';renderToday();return}
 const q=s.queue[s.index];if(!q){finishPhase();return}const v=byId[q.id],fields=expectedFields(q),fb=s.feedback,test=q.kind==='test';
 const label=s.type==='learn'?`День ${s.day}`:s.type==='repair'?'Работа над ошибками':'Повторение';
 const step=test?4:q.kind==='triple'?1:q.kind==='single'?2:3;
 const cue=AMBIGUOUS.has(v.id)?`<p class="small muted">Глагол на букву <strong lang="en">${v.id[0]}</strong>.</p>`:'';
 let prompt=q.kind==='triple'||test?`<p class="prompt">${esc(v.meaning)}</p>${cue}<p class="muted">Вспомни и напиши три формы по-английски.</p>`:q.kind==='single'?`<p class="prompt">V${q.field+1} от <span lang="en">${v.id}</span></p><p class="muted">${esc(v.meaning)}. Нужна только указанная форма.</p>`:`<p class="sentence" lang="en">${esc(v.sentence).replace('{}','<span class="blank" aria-label="пропуск">&nbsp;</span>')}</p><p class="muted">${esc(v.translation)}</p><p class="small">Глагол: <strong lang="en">${v.id}</strong> · ${esc(v.meaning)}</p>`;
 document.getElementById('app').innerHTML=`<div class="session"><div class="session-top"><p><strong>${label}</strong><br><span class="small muted">${s.phase==='test'?'Проверка':q.retry?'Повторная попытка':q.spacer?'Промежуточное повторение':'Практика'} · ${s.index+1} из ${s.queue.length}</span></p><button class="quiet" data-action="pause">Пауза</button></div><div class="track"><span style="width:${s.index/s.queue.length*100}%"></span></div>${s.type==='learn'?`<div class="steps"><span class="${step===1?'current':''}">1 · Три формы</span><span class="${step===2?'current':''}">2 · V2 и V3</span><span class="${step===3?'current':''}">3 · Предложения</span><span class="${step===4?'current':''}">4 · Проверка</span></div>`:''}<section class="panel task-panel"><p class="eyebrow">${stageName(q)}</p>${prompt}
 <form id="answer-form" autocomplete="off"><div class="entry-grid ${fields.length===1?'single':''}">${fields.map((field,i)=>`<div class="field"><label for="answer-${i}">${fieldLabel(v,field)}</label><input id="answer-${i}" name="answer-${i}" type="text" lang="en" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-field="${field}" value="${esc(fb?.values[i]??s.draft?.[i]??'')}" ${fb?'readonly':''} ${fb?`class="${fb.correct[i]?'correct':'incorrect'}" aria-invalid="${!fb.correct[i]}"`:''} aria-describedby="${fb?`field-result-${i}`:'input-note'}">${fb?`<div id="field-result-${i}" class="field-result ${fb.correct[i]?'success-text':'error-text'}">${fb.correct[i]?'Верно':`Нужно: ${esc(v.forms[field].join(' / '))}`}</div>`:''}</div>`).join('')}</div><p id="input-note" class="small muted">${v.id==='be'&&fields.includes(1)?'В поле V2 для be нужны обе формы через /; в остальных полях — одна подходящая форма.':'Без to. Если есть варианты, достаточно одного.'}</p><div id="validation" role="alert" class="small error-text"></div>
 ${fb?`<div class="feedback ${fb.ok?'':'bad'}"><p><strong>${fb.ok?'Верно.':fb.skipped?'Сверь формы и произнеси их вслух.':'Сравни свой ответ с правильным.'}</strong></p><p class="answer">${formsMarkup(v)}</p>${v.note?`<p class="small">${esc(v.note)}</p>`:''}${!fb.ok?`<p class="small">${q.attempt<2?'Этот глагол вернётся после трёх других заданий.':'Сегодня было несколько трудных попыток. Глагол сохранён для дополнительной работы.'}</p>`:''}</div><div class="actions task-actions"><button type="button" class="primary" data-action="next">Дальше →</button></div>`:`<div class="actions task-actions"><button class="primary" type="submit">${test?'Записать ответ':'Проверить'}</button><button type="button" class="quiet" data-action="skip">Не помню</button></div>`}
 </form>${test?'<p class="definition">Ответы и результат появятся после всей проверки. До этого не открывай таблицу.</p>':q.kind==='context'?grammarDetails():''}</section><p class="small muted">${test?'Глагол засчитывается только при верных трёх формах.':'Можно прерваться — текущее задание сохранится.'}</p></div>`;
 document.getElementById('answer-form').addEventListener('submit',e=>{e.preventDefault();submitAnswer(false)});
 document.querySelectorAll('#answer-form input').forEach(el=>el.addEventListener('input',()=>{s.draft=[...document.querySelectorAll('#answer-form input')].map(i=>i.value);save()}));
}
function scheduleRetry(s,q){
 if(q.attempt>=2)return;
 let pos=s.index+1,other=0;while(pos<s.queue.length&&other<3){if(s.queue[pos].id!==q.id)other++;pos++}
 if(other<3){let candidates=shuffle(s.pool.filter(id=>id!==q.id));if(candidates.length<3)candidates=shuffle(dayVerbs(byId[q.id].day).filter(v=>v.id!==q.id).map(v=>v.id));for(let i=other;i<3;i++){s.queue.push(task(candidates[(i-other)%candidates.length],'triple',null,{spacer:true,attempt:2}));pos++}}
 s.queue.splice(pos,0,{...q,attempt:q.attempt+1,retry:true,spacer:false});
}
function submitAnswer(skipped){
 const s=state.session;if(!s||s.feedback)return;const q=s.queue[s.index],v=byId[q.id],fields=expectedFields(q),values=[...document.querySelectorAll('#answer-form input')].map(i=>i.value);
 if(!skipped&&values.some(x=>!normalize(x))){document.getElementById('validation').textContent='Заполни все поля или нажми «Не помню».';return}
 const correct=fields.map((field,i)=>!skipped&&answerMatches(values[i],v,field)),ok=correct.every(Boolean);
 const result={id:q.id,kind:q.kind,values,fields,correct,ok,skipped,attempt:q.attempt,spacer:!!q.spacer};s.answers.push(result);
 if(!ok&&!s.mistakes.includes(q.id))s.mistakes.push(q.id);
 if(q.kind==='test'){s.index++;s.draft=[];if(s.index>=s.queue.length)finishPhase();else{save();renderSession();focusInput()}return}
 if(!ok)scheduleRetry(s,q);s.feedback=result;s.draft=[];save();renderSession();document.getElementById('announcer').textContent=ok?'Верно':'Есть ошибка. Правильные формы показаны.';
 const next=document.querySelector('[data-action="next"]');if(next)next.focus({preventScroll:true});
}
function focusInput(){if(window.matchMedia('(min-width:700px)').matches)document.getElementById('answer-0')?.focus({preventScroll:true})}
function nextQuestion(){const s=state.session;if(!s?.feedback)return;s.index++;s.feedback=null;s.draft=[];if(s.index>=s.queue.length)finishPhase();else{save();renderSession();focusInput()}}
function updateReview(id,ok){
 const t=today(),old=state.verbs[id];
 if(!ok){state.verbs[id]={anchor:t,lastPass:old?.lastPass??null,passes:0,due:t+1,needsRepair:true};return}
 if(!old){state.verbs[id]={anchor:t,lastPass:t,passes:0,due:t+1,needsRepair:false};return}
 const r={...old,needsRepair:false};
 if(t===r.lastPass||t<r.due){state.verbs[id]=r;return}
 if(r.lastPass===null){r.anchor=t;r.lastPass=t;r.passes=0;r.due=t+1;state.verbs[id]=r;return}
 r.passes=Math.min(4,(r.passes||0)+1);r.lastPass=t;r.due=r.passes>=4?t+30:Math.max(t+1,r.anchor+OFFSETS[r.passes]);state.verbs[id]=r;
}
function finishPhase(){
 const s=state.session;if(!s)return;
 if(s.type==='learn'&&s.phase==='practice'){
  s.practiceAnswers=s.answers;s.phase='test';s.queue=shuffle(s.pool).map(id=>task(id,'test'));s.index=0;s.answers=[];s.feedback=null;s.draft=[];save();renderSession();notify('Практика завершена. Теперь 10 глаголов без показа ответов до конца проверки.');return;
 }
 const results=s.type==='repair'?s.pool.map(id=>{const a=s.answers.filter(x=>x.id===id);return a[a.length-1]}).filter(Boolean):s.answers;
 if(s.type!=='repair')for(const r of results)updateReview(r.id,r.ok);
 else for(const r of results){const old=state.verbs[r.id];if(old&&r.ok){old.needsRepair=false;old.lastPass=today();old.anchor=today();old.passes=0;old.due=today()+1}}
 const correct=results.filter(r=>r.ok).length;
 if(s.type==='learn')state.days[s.day]={date:today(),score:correct};
 state.lastSummary={type:s.type,day:s.day,results,correct,total:results.length,mistakes:s.mistakes,date:today()};state.session=null;save();navigate('summary');
}
function renderSummary(){
 const s=state.lastSummary;if(!s){view='today';renderToday();return}const errors=s.results.filter(r=>!r.ok),next=s.day?Math.min(12,s.day+1):nextDay();
 document.getElementById('app').innerHTML=`<div class="session"><p class="eyebrow">${s.type==='repair'?'Работа над ошибками':s.type==='review'?'Повторение':`День ${s.day} · итоговая проверка`}</p><h1>${s.type==='repair'?'Повторная попытка завершена':'Результат по памяти'}</h1><section class="panel"><div class="summary-score">${s.correct}<span class="muted"> / ${s.total}</span></div><p>${s.type==='repair'?'Это результат отработки после показа правильных форм.':'Столько глаголов воспроизведено без ошибок во всех трёх формах.'}</p><p class="muted">${errors.length?'Разбери ошибки ниже и повтори эти глаголы. Следующая проверка по памяти — в другой день.':s.type==='review'?'Следующие даты уже назначены в разделе «Повторение».':'Следующая проверка — завтра. Сегодняшний результат показывает первый успех; запоминание проверим с интервалом.'}</p>${s.mistakes.length&&s.type==='learn'?`<p class="small muted">Во время практики трудности вызвали: <span lang="en">${s.mistakes.join(', ')}</span>.</p>`:''}
 <ul class="result-list">${s.results.map(r=>{const v=byId[r.id];return`<li><div class="small ${r.ok?'success-text':'error-text'}">${r.ok?'Верно':'Нужно повторить'} · ${esc(v.meaning)}</div><div class="answer">${formsMarkup(v)}</div>${!r.ok?`<div class="wrong-answer">Твой ответ: ${esc(r.values.map(x=>x.trim()||'—').join(' · '))}${r.skipped?' (не вспомнила)':''}</div>`:''}${!r.ok&&v.note?`<div class="small muted">${esc(v.note)}</div>`:''}</li>`}).join('')}</ul>
 ${s.results.some(r=>r.id==='read')?'<p class="small">Проверь произношение read вслух: V1 /riːd/, V2 /red/, V3 /red/. По написанию этого различия не видно.</p>':''}
 <div class="actions">${errors.length?'<button class="primary" data-action="repair">Отработать ошибки</button>':''}<button class="${errors.length?'quiet':'primary'}" data-action="nav" data-view="review">Даты повторений</button><button class="quiet" data-action="select-day" data-day="${next}">${s.day&&s.day<12?'Следующая десятка на завтра':'К десяткам'}</button></div></section></div>`;
}
function renderHelp(){document.getElementById('app').innerHTML=`<div class="help"><p class="eyebrow">Как заниматься</p><h1>Как заниматься</h1><section><p>Каждый день — десять новых глаголов и короткое повторение пройденных. Весь набор — 120 глаголов. На первый проход нужно 12 учебных дней; закрепление продолжается после него.</p><ol class="rule-list"><li><strong>Знакомство.</strong> Прочитай значение и формы вслух. На каждой карточке скрой формы, попробуй назвать их и проверь себя. Пройди десять карточек, затем переходи к заданиям.</li><li><strong>Восстановление по памяти.</strong> Перейди к заданиям. По переводу напиши три формы. Если забыто, сначала попробуй вспомнить, затем нажми «Не помню» и сверяй ответ.</li><li><strong>Отдельная форма.</strong> Вспомни V2 или V3, не начиная каждый раз всю тройку с V1. Порядок глаголов меняется.</li><li><strong>Предложение.</strong> Вставь форму в короткий контекст. Перевод дан, поэтому незнакомое существительное не мешает тренировать глагол. При необходимости открой напоминание о конструкции.</li><li><strong>Проверка.</strong> Ещё раз напиши три формы десяти глаголов. До конца проверки правильные ответы скрыты.</li><li><strong>Возврат в другой день.</strong> Открой раздел «Повторение». Плановые интервалы — 1, 3, 7 и 14 дней после первого успешного воспроизведения. После ошибки цикл начинается заново.</li></ol><p class="small muted">Если сегодня запоминается тяжело, прервись после пяти глаголов или между упражнениями и продолжи позже. Пауза сохраняет ответы. Десять — объём нового материала за день, а не ограничение на повторение.</p></section>
 <section><h2>Что означают три формы</h2><table class="mini-table"><thead><tr><th>Форма</th><th>Для чего нужна</th><th>Пример</th></tr></thead><tbody><tr><td><strong>V1</strong></td><td>Исходная форма без to. Нужна, например, после did / didn’t.</td><td lang="en">write<br>Did you write?</td></tr><tr><td><strong>V2</strong></td><td>Утвердительное предложение в Past Simple — о прошлом.</td><td lang="en">wrote<br>I wrote yesterday.</td></tr><tr><td><strong>V3</strong></td><td>Причастие прошедшего времени. В упражнениях используется после have / has.</td><td lang="en">written<br>I have written.</td></tr></tbody></table><p class="small muted" style="margin-top:14px">I wrote yesterday — Я писала вчера. I have written — Я написала. Три формы не равны трём временам. V3 также используется в других конструкциях, например в страдательном залоге. Здесь задача — запомнить сами формы.</p><p><strong>После did / didn’t возвращается V1:</strong> <span lang="en">Did you go? I didn’t go.</span> У be особое прошедшее: <span lang="en">I / he / she / it was; you / we / they were.</span> В поле V2 для be напиши обе формы: <span lang="en">was / were.</span></p></section>
 <section><h2>Как устроен порядок</h2><p>Сначала 15 глаголов с одинаковыми тремя формами. Затем 55 глаголов с двумя одинаковыми формами: 50 с совпадением V2 и V3, четыре с совпадением V1 и V3, один с совпадением V1 и V2. Далее get с вариантами got / gotten и 49 глаголов с разными основными формами.</p><p>Во второй десятке граница проходит посередине. Так сохраняются и порядок групп, и ровно десять новых глаголов в каждом дне.</p><p><strong>Read</strong> относится к совпадению двух форм по произношению: <span lang="en">read /riːd/ · read /red/ · read /red/</span>. На письме все три выглядят одинаково.</p><p>Формы сгруппированы по основному учебному варианту. У dream, learn, burn, smell, spell есть также формы на -ed. Они принимаются в ответах. У get, show, wake и prove варианты пояснены отдельно.</p><p class="small muted">У переводов, которые подходят нескольким глаголам, первая буква уточняет нужное слово. Самих форм эта подсказка не показывает. Учебные значения ограничены теми, которые нужны здесь.</p></section>
 <section><h2>Что считает проверка</h2><p>Ответ проверяется по написанию. Регистр букв и лишние пробелы по краям не влияют на результат; пропущенная буква считается ошибкой. Для обычных вариантов достаточно одной допустимой формы. Исключение — V2 у be, где требуются was и were.</p><p>Во время практики после ошибки показывается правильная тройка. Повторная попытка идёт после трёх других заданий. Если глагол снова не вспоминается, он остаётся в списке трудных. Во время итоговой проверки ответы показываются после всех заданий.</p><p>Отметка о четырёх проверках появляется только после успешного воспроизведения в четыре разные даты. Она означает прохождение заданного цикла, а не гарантию, что слово больше никогда не забудется. Дальше назначается повторение через 30 дней.</p><p class="small muted">Произношение не оценивается автоматически. Формы нужно проговаривать вслух. Кнопка «Послушать формы» использует английский голос устройства, если он доступен.</p></section>
 <section><h2>Почему выбраны такие упражнения</h2><p>Основу составляют самостоятельное воспроизведение и повторение с интервалами. Польза этих принципов для долговременного запоминания подтверждается исследованиями. Конкретная последовательность упражнений и график 1–3–7–14 — рабочая учебная схема, а не единственный доказанный оптимум для каждого ученика.</p><p class="small"><a href="https://learninglab.psych.purdue.edu/downloads/2008/2008_Karpicke_Roediger_Science.pdf" target="_blank" rel="noopener">Karpicke & Roediger, 2008 — The Critical Importance of Retrieval for Learning</a><br><a href="https://journals.sagepub.com/doi/10.1111/j.1467-9280.2008.02209.x" target="_blank" rel="noopener">Cepeda et al., 2008 — Spacing Effects in Learning</a><br><a href="https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/irregular-verbs" target="_blank" rel="noopener">British Council — формы неправильных глаголов</a><br>Merriam-Webster — варианты форм <a href="https://www.merriam-webster.com/dictionary/quit" target="_blank" rel="noopener">quit</a>, <a href="https://www.merriam-webster.com/dictionary/shrink" target="_blank" rel="noopener">shrink</a>, <a href="https://www.merriam-webster.com/dictionary/prove" target="_blank" rel="noopener">prove</a>.</p></section>
 <section><h2>Печать и сохранение прогресса</h2><p>После загрузки страницы задания не требуют подключения к интернету. Прогресс сохраняется в этом браузере для этого адреса сайта. Для переноса на другое устройство скачай прогресс, а затем загрузи его в тот же тренажёр. Файл прогресса переносит результаты завершённых занятий; незавершённое занятие остаётся в текущем браузере.</p><p class="small muted">Озвучивание зависит от установленных голосов; внешние ссылки открываются при наличии интернета.</p><div class="actions"><button data-action="export">Скачать прогресс</button><button class="quiet" data-action="import">Загрузить прогресс</button><button class="quiet" data-action="print">Распечатать день ${state.selectedDay}</button></div><p class="small muted" style="margin-top:14px">Для интерактивных заданий нужен браузер: просмотрщик вложений может показать страницу, но не выполнять кнопки.</p></section></div>`;
 document.querySelectorAll('.help > section').forEach((section,i)=>{
  const details=document.createElement('details');details.className='guide-block';
  const title=section.querySelector('h2')?.textContent||'Занятие по шагам';
  section.querySelector('h2')?.remove();
  details.innerHTML=`<summary>${esc(title)}</summary><div class="guide-content">${section.innerHTML}</div>`;
  if(helpFocus==='grammar'&&i===1)details.open=true;
  section.replaceWith(details);
 });helpFocus=null;
}
function speak(id){
 const v=byId[id];if(!('speechSynthesis'in window)){notify('На этом устройстве озвучивание недоступно.');return}
 const voices=speechSynthesis.getVoices().filter(v=>/^en(?:-|_)/i.test(v.lang));if(!voices.length){notify('Английский голос пока недоступен. Открой примечание и прочитай формы вслух.');return}
 speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(id==='read'?'reed. red. red.':v.forms.flat().join('. '));utterance.voice=voices.find(v=>v.localService)||voices[0];utterance.lang=utterance.voice.lang;utterance.rate=.78;utterance.onerror=()=>notify('Озвучивание не удалось. Можно прочитать формы вслух самостоятельно.');speechSynthesis.speak(utterance);
}
function exportProgress(){const blob=new Blob([JSON.stringify({...state,session:null,lastSummary:null},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='verb-forms-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function validatedImport(raw){
 const x=JSON.parse(raw);if(x.version!==1||!x.verbs||!x.days||Array.isArray(x.verbs)||Array.isArray(x.days))throw Error('Неподходящий файл прогресса.');
 const n=fresh();for(const[id,r]of Object.entries(x.verbs)){if(!byId[id]||!r||!Number.isInteger(r.anchor)||!Number.isInteger(r.due)||!Number.isInteger(r.passes)||r.passes<0||r.passes>4||!(r.lastPass===null||Number.isInteger(r.lastPass)))throw Error('Файл прогресса содержит неверные данные.');n.verbs[id]={anchor:r.anchor,due:r.due,passes:r.passes,lastPass:r.lastPass,needsRepair:!!r.needsRepair}}
 for(const[d,r]of Object.entries(x.days)){if(!/^([1-9]|1[0-2])$/.test(d)||!r||!Number.isInteger(r.date)||!Number.isInteger(r.score)||r.score<0||r.score>10)throw Error('Файл прогресса содержит неверные данные.');n.days[d]={date:r.date,score:r.score}}
 n.selectedDay=Number.isInteger(x.selectedDay)&&x.selectedDay>=1&&x.selectedDay<=12?x.selectedDay:1;return n;
}
function printDay(){const vs=dayVerbs(state.selectedDay),mix=shuffle(vs);document.getElementById('printable').innerHTML=`<h1>Формы глаголов</h1><p>День ${state.selectedDay} · 10 глаголов</p><h2>1. Знакомство</h2><p>Прочитай значение и формы. Закрой таблицу, прежде чем переходить к заданиям.</p><table><thead><tr><th>Значение</th><th>V1</th><th>V2</th><th>V3</th></tr></thead><tbody>${vs.map(v=>`<tr><td>${esc(v.meaning)}</td>${v.forms.map(f=>`<td>${esc(f.join(' / '))}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="page-break"></div><h2>2. Восстанови три формы</h2><p>Закрой таблицу. Напиши V1, V2 и V3 по значению.</p><ol>${mix.map(v=>`<li>${esc(v.meaning)}${AMBIGUOUS.has(v.id)?` (на букву ${v.id[0]})`:''}<div class="print-lines">V1 __________________ &nbsp; V2 __________________ &nbsp; V3 __________________</div></li>`).join('')}</ol><div class="page-break"></div><h2>3. Вспомни отдельную форму</h2><ol>${shuffle(vs).map(v=>`<li>V${v.contextForm===2?3:2} от ${v.id}: __________________</li>`).join('')}</ol><h2>4. Вставь форму в предложение</h2><ol>${shuffle(vs).map(v=>`<li>${esc(v.sentence).replace('{}','________________')} (${v.id})<br><span class="print-small">${esc(v.translation)}</span></li>`).join('')}</ol><div class="page-break"></div><h2>Ключи и повторение</h2><table class="keys">${vs.map(v=>`<tr><td>${formsMarkup(v)}</td><td>${esc(v.note||'')}</td></tr>`).join('')}</table><h3 style="margin-top:20px">Ответы в предложениях</h3>${vs.map(v=>`<p class="print-small">${fullExample(v)}</p>`).join('')}<p>После проверки закрой ответы и вернись к ошибкам через несколько других глаголов. На следующий день снова выполни задание 2. Плановые возвраты: через 1, 3, 7 и 14 дней.</p>`;window.print()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='nav')navigate(b.dataset.view);
 else if(a==='select-day'){const d=Number(b.dataset.day);if(d<1||d>12)return;state.selectedDay=d;hiddenRows.clear();openRows.clear();studyList=false;navigate('today')}
 else if(a==='study-mode'){studyList=b.dataset.mode==='all';renderToday()}
 else if(a==='study-open')moveStudy(Number(b.dataset.index));
 else if(a==='study-prev')moveStudy(studyPosition(state.selectedDay)-1);
 else if(a==='study-next'){const n=studyPosition(state.selectedDay);if(n===9)startSession('learn',state.selectedDay);else moveStudy(n+1)}
 else if(a==='study-hide'){const id=dayVerbs(state.selectedDay)[studyPosition(state.selectedDay)].id;hiddenRows.has(id)?hiddenRows.delete(id):hiddenRows.add(id);renderToday();document.querySelector('[data-action="study-hide"]')?.focus({preventScroll:true})}
 else if(a==='grammar'){helpFocus='grammar';navigate('help')}
 else if(a==='hide-all'){const ids=dayVerbs(state.selectedDay).map(v=>v.id);hiddenRows=hiddenRows.size===10?new Set():new Set(ids);renderToday()}
 else if(a==='row-toggle'){const id=b.dataset.id;hiddenRows.has(id)?hiddenRows.delete(id):hiddenRows.add(id);renderToday()}
 else if(a==='row-info'){const id=b.dataset.id;openRows.has(id)?openRows.delete(id):openRows.add(id);hiddenRows.delete(id);renderToday()}
 else if(a==='start')startSession('learn',Number(b.dataset.day));
 else if(a==='resume')navigate('session');
 else if(a==='pause')navigate('today');
 else if(a==='next')nextQuestion();
 else if(a==='skip')submitAnswer(true);
 else if(a==='review-start')startSession('review',null,dueIds().slice(0,10));
 else if(a==='repair'){const ids=state.lastSummary?.results.filter(r=>!r.ok).map(r=>r.id)||[];if(ids.length)startSession('repair',null,ids)}
 else if(a==='speak')speak(b.dataset.id);
 else if(a==='export')exportProgress();
 else if(a==='import')document.getElementById('import-file').click();
 else if(a==='print')printDay();
});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Файл слишком большой для прогресса тренажёра.');const loaded=validatedImport(await file.text());if((Object.keys(state.verbs).length||state.session)&&!confirm('Заменить текущий прогресс данными из выбранного файла?'))return;state=loaded;hiddenRows.clear();openRows.clear();save();navigate('today');notify('Прогресс загружен.')}catch(err){notify(err.message||'Не удалось загрузить прогресс.')}finally{e.target.value=''}});
window.addEventListener('beforeunload',save);
if(!state.session&&state.days[state.selectedDay]?.date<today())state.selectedDay=nextDay();
if('speechSynthesis'in window)speechSynthesis.getVoices();
render();
</script>
