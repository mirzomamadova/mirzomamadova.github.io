async function playWord(id,rate=1){const w=WORDS.find(x=>x.id===id);if(!w)return;audio.pause();audio.src='https://mirzomamadova.github.io/wh-words/assets/audio/'+w.audio;audio.playbackRate=rate;audio.preservesPitch=true;if('webkitPreservesPitch'in audio)audio.webkitPreservesPitch=true;$('#audio-status').textContent='Слушай слово…';try{await audio.play()}catch{$('#audio-status').textContent='Запись не включилась. Проверь звук и интернет, затем нажми «Слушать» ещё раз.'}}
audio.addEventListener('ended',()=>{$('#audio-status').textContent='Запись закончилась.'});audio.addEventListener('error',()=>{$('#audio-status').textContent='Не удалось загрузить запись. Проверь интернет и попробуй ещё раз.'});
const speaker='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
function audioButtons(id){return `<div class="audio-actions"><button type="button" data-sound="${id}">${speaker}Слушать</button><button type="button" data-sound="${id}" data-rate="0.8">Медленнее</button></div>`}
function nav(){stopAudio();$('#profile-nav').textContent=store.learner?name():'Кто занимается?';main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
function profileChooser(){return `<section class="profile-choose"><div><h2>Кто занимается?</h2><p class="small">У каждой свой прогресс и свои слова для повторения.</p></div><div class="actions"><button class="primary" data-profile="nigor">Нигор</button><button class="secondary" data-profile="zebi">Мама Зеби</button></div></section>`}
function home(){view='home';activeDay=null;nav();const done=store.learner?Object.keys(person().days).length:0;main.innerHTML=`<div class="intro"><div><p class="eyebrow">4 ДНЯ · ПО 10–15 МИНУТ</p><h1>Услышь слово.<br><span>Построй вопрос.</span></h1><p>Что, кто, где, когда, почему, как и какой из вариантов. Сначала учимся слышать, читать и писать слова. Затем составляем вопросы с to be.</p></div><aside class="statcard"><b>${done} / 4</b><p>дня завершено${store.learner?' · '+name():''}</p><div class="track" aria-hidden="true"><span style="width:${done*25}%"></span></div></aside></div>${!store.learner?profileChooser():''}<div class="days">${DAYS.map(d=>{const completed=store.learner&&person().days[d.id],s=store.learner&&person().sessions[d.id];return `<section class="day"><div class="day-label"><strong>День ${d.id}</strong><span class="pill ${completed?'donepill':''}">${completed?'Завершён':s?'Можно продолжить':'10–15 минут'}</span></div><h2>${d.title}</h2><p>${d.subtitle}</p><ul>${d.steps.map(x=>'<li>'+x+'</li>').join('')}</ul><div class="actions"><button class="primary" data-day="${d.id}">${s?'Продолжить':completed?'Повторить день':'Начать день'}</button><span class="small">${d.count} коротких заданий</span></div></section>`}).join('')}</div><p class="note">Занимайся по одному дню за подход. Если нужно больше времени, остановись и продолжи позже. Ошибки вернутся через несколько заданий, чтобы слово вспомнилось без подсказки.</p><div class="toolsrow"><button data-view="words">Все 7 слов и записи</button><button data-view="guide">Как строить вопрос</button><button data-view="report">Мои результаты</button></div>`;bindCommon()}
function chooseProfile(id){store.learner=id;save();$('#modal-root').innerHTML='';home()}
function modalProfiles(){const root=$('#modal-root');root.innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Кто сейчас занимается?</h2><p>Сохранённые результаты останутся у каждой.</p><div class="actions"><button class="primary" data-profile="nigor">Нигор</button><button data-profile="zebi">Мама Зеби</button><button class="textbtn" id="close-modal">Закрыть</button></div></section></div>`;root.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>chooseProfile(b.dataset.profile));$('#close-modal').onclick=()=>{root.innerHTML='';$('#profile-nav').focus()};root.querySelector('button').focus();root.onkeydown=e=>{if(e.key==='Escape')$('#close-modal').click();if(e.key==='Tab'){const a=[...root.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}}}
function tasksForDay(day){const words=kind=>shuffle(WORDS.map(w=>({kind,ref:w.id})));const set=(kind,a)=>shuffle(a.map((_,ref)=>({kind,ref})));let tasks=[];if(day===1)tasks=[...words('learn'),...words('meaning')];if(day===2)tasks=[...words('listenPick'),...words('dictation'),...set('wh',WH_TASKS)];if(day===3)tasks=[...words('spell'),...set('be',BE_TASKS),...set('build',BUILD_TASKS)];if(day===4)tasks=[...words('dictation'),...set('write',WRITE_TASKS),...words('pronounce')];return tasks.map((t,i)=>({...t,uid:`${day}-${i}`,review:false,options:makeOptions(t)}))}
function makeOptions(t){const w=wordFor(t);if(t.kind==='meaning')return shuffle(WORDS.map(x=>x.id));if(t.kind==='listenPick'){const close={where:['when','why'],when:['where','which'],why:['where','who'],which:['when','what'],who:['how','what'],how:['who','why'],what:['which','who']};return shuffle([w.id,...close[w.id]])}if(t.kind==='wh')return shuffle(WORDS.map(x=>x.id));if(t.kind==='be')return shuffle(['am','is','are']);if(t.kind==='build'){const a=BUILD_TASKS[t.ref].q.replace('?','').split(' ');let mix=shuffle(a);if(mix.join(' ')===a.join(' '))mix.push(mix.shift());return mix}return []}
function startDay(day){if(!store.learner){modalProfiles();return}view='exercise';activeDay=Number(day);if(!person().sessions[day])person().sessions[day]={queue:tasksForDay(activeDay),cursor:0,answers:[],start:new Date().toISOString(),base:DAYS[activeDay-1].count};const resumed=person().sessions[day];if(resumed.pending===resumed.cursor){resumed.cursor++;delete resumed.pending}save();resetTask();nav();renderExercise()}
function session(){return person().sessions[activeDay]}
function task(){return session().queue[session().cursor]}
function resetTask(){selected=null;feedback=null;revealed=false;learnPhase='model';oralRevealed=false;tokens=[];chosen=[]}
function guideHTML(open=false){return `<details class="guide" ${open?'open':''}><summary>Как составить вопрос с to be</summary><div class="guide-body"><p><b>Сначала реши, что ты хочешь узнать.</b> Потом выбери am / is / are и поставь слова в нужном порядке.</p><div class="guide-tabs">${[['where','Место'],['when','Время'],['why','Причина'],['which','Выбор']].map(([id,label])=>`<button type="button" data-guide="${id}" aria-pressed="${guideTab===id}">${label}</button>`).join('')}</div><div id="guide-example">${guideExample()}</div><div class="rule"><div>I<strong>am</strong></div><div>he / she / it<strong>is</strong></div><div>you / we / they<strong>are</strong></div></div><p class="small">Один предмет: Where <b>is</b> your phone? Несколько: Where <b>are</b> your keys?</p><p class="small">В этих вопросах используем to be, поэтому do / does не добавляем. Вопросительное слово требует ответа по смыслу: о месте, времени, человеке или причине.</p></div></details>`}
function guideExample(){const e={where:{before:'She is at home. — Она дома.',ask:'Нужно узнать место. Вместо at home спрашиваем where.',parts:['Where','is','she?'],note:'В вопросе is стоит перед she: Where is she? — Где она?'},when:{before:'The lesson is on Monday. — Урок в понедельник.',ask:'Нужно узнать день. Вместо on Monday спрашиваем when.',parts:['When','is','the lesson?'],note:'When is the lesson? — Когда урок?'},why:{before:'She is tired. — Она устала.',ask:'Нужно узнать причину. Tired остаётся: мы спрашиваем, почему она устала.',parts:['Why','is','she','tired?'],note:'Why is she tired? — Почему она устала?'},which:{before:'Перед нами две ручки. Хотим узнать, какая твоя.',ask:'Which pen — целая группа «какая из ручек». Ставим её в начало.',parts:['Which pen','is','yours?'],note:'Здесь Which pen само называет предмет вопроса. Yours — твоя. Не разделяй Which и pen.'}}[guideTab];return `<p>${e.before}</p><p class="small">${e.ask}</p><div class="formula">${e.parts.map(x=>'<span>'+x+'</span>').join('')}</div><p>${e.note}</p>`}
function renderExercise(){const s=session();if(s.cursor>=s.queue.length){finishDay();return}const t=task(),w=wordFor(t),d=DAYS[activeDay-1];let title='',instruction='',body='',controls='',learnInput=false;const at=s.cursor+1,total=s.queue.length;
if(t.kind==='learn'){title='Послушай, прочитай и напиши';instruction='Послушай слово два раза и повтори вслух. Затем скрой образец и напиши слово по памяти.';if(learnPhase==='model'){body=`<div class="model"><p class="word" lang="en">${w.en}</p><p class="ipa">${w.ipa}</p><p class="ru">${w.ru}</p>${audioButtons(w.id)}</div><p>${w.sense}</p><p class="small">${w.tip}</p>`;controls='<button type="button" class="primary" id="hide-model">Скрыть и написать</button>'}else{body=`<p class="prompt">${w.ru}</p><p class="small">Вспомни, как пишется слово. Образец скрыт.</p>${inputHTML('Одно английское слово')}`;learnInput=true}}
if(t.kind==='meaning'){title='Что значит это слово?';instruction='Прочитай слово вслух, затем выбери значение.';body=`<p class="prompt" lang="en">${w.en}</p>${choicesHTML(t.options,id=>WORDS.find(x=>x.id===id).ru)}`}
if(t.kind==='listenPick'){title='Какое слово прозвучало?';instruction='Нажми «Слушать». Выбери слово, которое услышала. Обрати внимание на начало и конец.';body=`<div class="listening">${audioButtons(w.id)}<p class="listen-note">Можно прослушать несколько раз.</p></div>${choicesHTML(t.options,id=>WORDS.find(x=>x.id===id).en)}`}
if(t.kind==='dictation'){title='Напиши слово на слух';instruction='Послушай запись. Напиши услышанное слово по-английски: без перевода и без списка.';body=`<div class="listening">${audioButtons(w.id)}</div>${inputHTML('Услышанное слово')}`}
if(t.kind==='spell'){title='Вспомни слово';instruction='Напиши вопросительное слово по русскому значению. Сначала попробуй без подсказки.';body=`<p class="prompt">${w.ru}</p>${inputHTML('Одно английское слово')}`}
if(t.kind==='wh'){const a=WH_TASKS[t.ref];title='Что нужно узнать?';instruction='Прочитай ответ. Выбери вопросительное слово, чтобы вопрос подходил к нему.';body=`<p class="prompt" lang="en">${a.q}</p><p lang="en"><b>Ответ:</b> ${a.a}</p><p class="small">${a.ru}</p>${choicesHTML(t.options,id=>WORDS.find(x=>x.id===id).en)}`}
if(t.kind==='be'){const a=BE_TASKS[t.ref];title='Выбери am, is или are';instruction='Посмотри, о ком или о чём спрашивают. Выбери нужную форму to be.';body=`<p class="prompt" lang="en">${a.q}</p>${choicesHTML(t.options,x=>x)}`}
if(t.kind==='build'){const a=BUILD_TASKS[t.ref];title='Собери вопрос';instruction='Нажимай на слова в нужном порядке. Нажми на слово в собранном вопросе, чтобы вернуть его вниз.';tokens=t.options;body=`<p class="prompt">${a.ru}</p><div class="sentence" id="sentence" aria-label="Твой вопрос">${sentenceHTML()}</div><div class="wordbank" id="wordbank">${bankHTML()}</div><p class="small">Знак вопроса добавится автоматически.</p>`}
if(t.kind==='write'){const a=WRITE_TASKS[t.ref];title='Составь вопрос сама';instruction='Реши, что нужно узнать. Выбери вопросительное слово, форму to be и порядок слов.';body=`<p class="prompt">${a.ru}</p><p class="vocab">${a.vocab}</p>${inputHTML('Твой вопрос по-английски')}`}
if(t.kind==='pronounce'){title='Прочитай и сравни';instruction='Сначала прочитай слово вслух сама. Затем послушай запись и повтори ещё раз.';body=`<p class="prompt" lang="en">${w.en}</p>${oralRevealed?`<p class="meaning">${w.ru}</p><p class="small">${w.ipa} · ${w.tip}</p><div class="listening">${audioButtons(w.id)}</div><p class="small">Это самопроверка: сайт не оценивает твоё произношение.</p>`:''}`;controls=oralRevealed?'<button type="button" class="primary" data-oral="yes">Прочитала и сравнила</button><button type="button" data-oral="repeat">Повторить ещё раз позже</button>':'<button type="button" class="primary" id="oral-reveal">Я прочитала. Сравнить</button>'}
const needCheck=!(t.kind==='learn'&&!learnInput)&&t.kind!=='pronounce';
main.innerHTML=`<section class="exercise"><div class="ex-top"><button class="textbtn" data-view="home">К плану</button><span>День ${activeDay} · задание ${at} из ${total}</span></div><div class="track" role="progressbar" aria-label="Прогресс дня" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${s.cursor}"><span style="width:${s.cursor/total*100}%"></span></div><p class="small">${d.title}${t.review?' · повторяем после ошибки':''}</p>${['wh','be','build','write'].includes(t.kind)?guideHTML(!t.review&&s.cursor===s.queue.findIndex(x=>x.kind===t.kind)):''}<div class="task"><span class="practice-label">${['wh','be','build','write'].includes(t.kind)?'Составляем вопрос':t.kind==='pronounce'?'Произношение':'Вопросительные слова'}</span><h1 class="ex-title">${title}</h1><p class="muted">${instruction}</p><form id="task-form" novalidate>${body}<div id="feedback" aria-live="polite"></div><div class="actions task-actions">${needCheck?'<button type="submit" class="primary" id="check">Проверить</button>':controls}</div></form></div><p class="small" style="margin-top:18px">Можно вернуться к плану и продолжить позже с этого задания.</p></section>`;
bindCommon();$('#task-form').onsubmit=e=>{e.preventDefault();checkAnswer()};$('#hide-model')?.addEventListener('click',()=>{learnPhase='recall';stopAudio();renderExercise();$('#answer')?.focus()});$('#oral-reveal')?.addEventListener('click',()=>{oralRevealed=true;renderExercise()});document.querySelectorAll('[data-oral]').forEach(b=>b.onclick=()=>recordOral(b.dataset.oral==='yes'));bindBuild()}
function inputHTML(label){return `<label class="answer-label" for="answer">${label}</label><input class="answer" id="answer" name="answer" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Напиши здесь" aria-describedby="feedback">`}
function choicesHTML(options,label){return `<div class="choices" role="group" aria-label="Варианты ответа">${options.map(v=>`<button type="button" data-choice="${esc(v)}" aria-pressed="false">${esc(label(v))}</button>`).join('')}</div>`}
function sentenceHTML(){return chosen.length?chosen.map(i=>`<button type="button" data-remove="${i}" aria-label="Убрать ${esc(tokens[i])}">${esc(tokens[i])}</button>`).join('')+'<span aria-hidden="true">?</span>':'<span class="placeholder">Здесь появится твой вопрос</span>'}
function bankHTML(){return tokens.map((x,i)=>`<button type="button" data-token="${i}" class="${chosen.includes(i)?'used':''}" ${chosen.includes(i)?'disabled':''}>${esc(x)}</button>`).join('')}
function bindBuild(){document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{chosen.push(Number(b.dataset.token));redrawBuild()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==Number(b.dataset.remove));redrawBuild()})}
function redrawBuild(){$('#sentence').innerHTML=sentenceHTML();$('#wordbank').innerHTML=bankHTML();bindBuild()}
function expected(t){if(['learn','spell','dictation','meaning','listenPick'].includes(t.kind))return wordFor(t).en;if(t.kind==='wh')return WORDS.find(w=>w.id===WH_TASKS[t.ref].word).en;if(t.kind==='be')return BE_TASKS[t.ref].answer;if(t.kind==='build')return BUILD_TASKS[t.ref].q;if(t.kind==='write')return WRITE_TASKS[t.ref].q;return wordFor(t)?.en||''}
function explanation(t){if(['learn','spell','dictation','meaning','listenPick'].includes(t.kind)){const w=wordFor(t);return `${w.en} — ${w.ru}. ${w.sense}`}if(t.kind==='wh')return WH_TASKS[t.ref].why;if(t.kind==='be')return BE_TASKS[t.ref].why;if(t.kind==='build')return BUILD_TASKS[t.ref].explain;if(t.kind==='write')return WRITE_TASKS[t.ref].explain;return ''}
function grade(t,value){const accepted=[expected(t)];if(t.kind==='write')accepted.push(...WRITE_TASKS[t.ref].alternatives||[]);return accepted.some(v=>norm(v)===norm(value))}
function checkAnswer(){if(feedback)return;const t=task();let answer='';if(['meaning','listenPick','wh','be'].includes(t.kind))answer=selected||'';else if(t.kind==='build')answer=chosen.map(i=>tokens[i]).join(' ');else answer=$('#answer')?.value||'';if(!answer.trim()){$('#feedback').innerHTML='<p class="notice">Сначала выбери или напиши ответ.</p>';$('#answer')?.focus();return}const ok=grade(t,answer);feedback={ok,answer};session().answers.push({uid:t.uid,kind:t.kind,ref:t.ref,answer,expected:expected(t),ok,review:t.review});if(!ok){const key=t.kind+':'+t.ref;person().mistakes[key]={kind:t.kind,ref:t.ref,expected:expected(t),count:(person().mistakes[key]?.count||0)+1};const repeat={...t,review:true,uid:t.uid+'r',options:makeOptions(t)};session().queue.splice(Math.min(session().cursor+4,session().queue.length),0,repeat)}session().pending=session().cursor;save();$('#feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><b>${ok?'Верно.':'Пока не получилось. Разберём и повторим.'}</b>${!ok?`<p class="correct" lang="en">${esc(expected(t))}</p>`:''}<p>${explanation(t)}</p><p class="small">${ok?'Произнеси слово или вопрос вслух.':'Посмотри на правильный ответ. Это задание вернётся через несколько других.'}</p>${wordFor(t)?audioButtons(wordFor(t).id):''}</div>`;$('#task-form').querySelectorAll('input,[data-choice],[data-token],[data-remove]').forEach(e=>e.disabled=true);$('.task-actions').innerHTML='<button type="button" class="primary" id="next">Дальше</button>';$('#next').onclick=advance;$('#next').focus({preventScroll:true});bindSounds()}
function recordOral(ok){if(feedback)return;const t=task();session().answers.push({uid:t.uid,kind:t.kind,ref:t.ref,answer:'самопроверка',expected:wordFor(t).en,ok,review:t.review,oral:true});if(!ok)session().queue.splice(Math.min(session().cursor+4,session().queue.length),0,{...t,review:true,uid:t.uid+'r'});advance()}
function advance(){delete session().pending;session().cursor++;save();resetTask();stopAudio();renderExercise();window.scrollTo({top:0,behavior:'instant'})}
function finishDay(){const s=session();const first=s.answers.filter(a=>!a.review&&!a.oral),oral=s.answers.filter(a=>a.oral);const result={finished:new Date().toISOString(),right:first.filter(x=>x.ok).length,total:first.length,repeats:s.answers.filter(a=>a.review).length,oral:oral.length,errors:s.answers.filter(a=>!a.ok&&!a.oral).map(a=>({kind:a.kind,ref:a.ref,answer:a.answer,expected:a.expected}))};person().days[activeDay]=result;delete person().sessions[activeDay];save();view='result';stopAudio();main.innerHTML=`<section class="exercise"><p class="eyebrow">ДЕНЬ ${activeDay} ЗАВЕРШЁН</p><h1>${Object.keys(person().days).length===4?'Четыре шага пройдены':'Хорошая работа на сегодня'}</h1><div class="summary"><p>Правильно с первой попытки</p><p class="big">${result.right} / ${result.total}</p><p>${result.repeats?'Заданий на повторение: '+result.repeats+'. Ты вернулась к трудным словам и вопросам.':'Все письменные задания получились с первого раза.'}</p>${oral.length?'<p class="small">Произношение проверяла сама, сравнивая с записью. Оно не входит в письменный результат.</p>':''}<p class="note">Следующий подход сделай в другой день. Перед ним попробуй назвать все семь слов и их значения без памятки.</p><div class="actions"><button class="primary" data-view="home">К плану на 4 дня</button><button data-view="report">Посмотреть результаты</button></div></div></section>`;bindCommon();nav()}
function wordsView(){view='words';nav();main.innerHTML=`<p class="eyebrow">ПАМЯТКА И ПРОИЗНОШЕНИЕ</p><h1>Семь вопросительных слов</h1><p class="note">Слушай, смотри на написание и повторяй. Затем вернись к заданиям: там нужно будет вспомнить слово самостоятельно. How тоже входит в эту группу.</p><div class="wordref">${WORDS.map(w=>`<section class="refcard"><h2 lang="en">${w.en} <span class="pron">${w.ipa}</span></h2><p class="meaning">${w.ru}</p><p>${w.sense}</p>${audioButtons(w.id)}<p class="small" style="margin-top:14px">${w.tip}</p></section>`).join('')}</div><div class="toolsrow"><button class="primary" data-view="home">Вернуться к заданиям</button></div>`;bindCommon()}
function guideView(){view='guide';nav();main.innerHTML=`<section class="exercise"><p class="eyebrow">ОТ СМЫСЛА К ВОПРОСУ</p><h1>Что ты хочешь узнать?</h1><p class="note">Вопросы на сайте — примеры устройства предложения. Твоя задача — выбрать слово по смыслу и построить свой вопрос.</p>${guideHTML(true)}<div class="wordref"><div class="refcard"><h3>Обычная схема</h3><p style="margin-top:12px">Вопросительное слово + am / is / are + о ком или о чём спрашиваем + остальное.</p><p class="small">Why + are + you + tired?</p></div><div class="refcard"><h3>Группа с which</h3><p style="margin-top:12px">Which pen / Which bag / Which book держим вместе.</p><p class="small">Which book + is + yours?</p></div></div><div class="toolsrow"><button class="primary" data-view="home">Вернуться к заданиям</button></div></section>`;bindCommon()}
function reportText(){
 if(!store.learner)return '';
 const p=person(),lines=[`Английский · WH-слова · ${name()}`];
 for(const d of DAYS){
  const r=p.days[d.id],ongoing=p.sessions[d.id];
  if(r)lines.push(`День ${d.id}: ${r.right}/${r.total} с первой попытки, повторений: ${r.repeats}${r.oral?', произношение — самопроверка':''}.`);
  else if(!ongoing)lines.push(`День ${d.id}: ещё не выполнен.`);
  if(ongoing){
   const answers=ongoing.answers||[],first=answers.filter(a=>!a.review&&!a.oral);
   lines.push(`День ${d.id}${r?' (повторное прохождение)':''}: в процессе; проверено письменных заданий: ${first.length}, правильно с первой попытки: ${first.filter(a=>a.ok).length}.`);
  }
  const errors=[...(r?.errors||[]),...(ongoing?.answers||[]).filter(a=>!a.ok&&!a.oral)];
  if(errors.length){const unique=[...new Map(errors.map(e=>[e.expected,e])).values()];lines.push('Повторяли: '+unique.map(e=>e.expected).join('; ')+'.')}
 }
 lines.push('Результаты с этого устройства. Произношение автоматически не оценивалось.');return lines.join('\n');
}
function reportStatus(message){const el=$('#copy-status');if(el)el.textContent=message}
function selectReportText(){const el=$('#report-text');if(!el)return;el.focus();el.select();el.setSelectionRange(0,el.value.length)}
async function copyReport(){
 const text=reportText();
 try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);reportStatus('Отчёт скопирован. Открой нужный чат и вставь текст сообщения.');return true}
 catch{selectReportText();try{if(document.execCommand('copy')){reportStatus('Отчёт скопирован. Открой нужный чат и вставь текст сообщения.');return true}}catch{}reportStatus('Текст выделен. Нажми на него и выбери «Копировать», затем вставь в нужный чат.');return false}
}
async function shareReport(){
 const text=reportText(),button=$('#share-report');
 if(button.disabled)return;
 button.disabled=true;
 try{
  if(typeof navigator.share!=='function'){
   const copied=await copyReport();
   if(copied)reportStatus('Меню отправки здесь недоступно. Отчёт скопирован — вставь его в нужный чат.');
   return;
  }
  await navigator.share({title:'Отчёт по английскому — '+name(),text});
  reportStatus('Отчёт передан в выбранное приложение.');
 }catch(error){
  if(error?.name==='AbortError')reportStatus('Отправка отменена. Можно нажать «Отправить отчёт» ещё раз.');
  else reportStatus('Не удалось открыть отправку. Нажми «Скопировать» или «Сохранить файлом» и отправь отчёт из своего чата.');
 }finally{button.disabled=false}
}
function downloadReport(){
 try{
  const blob=new Blob(['\uFEFF'+reportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`WH_report_${store.learner}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  reportStatus('Файл отчёта подготовлен. Открой загрузки и прикрепи его в нужном чате.');
 }catch{reportStatus('Не удалось сохранить файл. Используй кнопку «Скопировать».')}
}
function reportView(){
 if(!store.learner){modalProfiles();return}view='report';nav();
 main.innerHTML=`<section class="exercise"><p class="eyebrow">${name().toUpperCase()} · МОЯ ПРАКТИКА</p><h1>Результаты за четыре дня</h1><p class="note">Нажми «Отправить отчёт», выбери приложение и нужный чат. Можно отправить и промежуточный результат.</p><label for="report-text" class="answer-label">Отчёт</label><textarea class="report-text" id="report-text" readonly>${esc(reportText())}</textarea><div class="actions"><button type="button" class="primary" id="share-report">Отправить отчёт</button><button type="button" id="copy-report">Скопировать</button><button type="button" id="download-report">Сохранить файлом</button><button type="button" data-view="home">К заданиям</button></div><p id="copy-status" class="small" role="status" aria-live="polite" style="margin-top:12px"></p><details class="guide" style="margin-top:32px"><summary>Начать все четыре дня заново</summary><div class="guide-body"><p>Удалятся только результаты ${name()} на этом устройстве. У второй ученицы всё сохранится.</p><button id="reset-person" style="margin-top:16px">Очистить мои результаты</button></div></details></section>`;
 bindCommon();$('#share-report').onclick=shareReport;$('#copy-report').onclick=copyReport;$('#download-report').onclick=downloadReport;
 $('#reset-person').onclick=()=>{if(confirm('Удалить все результаты '+name()+' на этом устройстве?')){store.people[store.learner]={days:{},sessions:{},mistakes:{}};save();home()}};
}
function bindSounds(){document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>playWord(b.dataset.sound,Number(b.dataset.rate||1)))}
function go(v){if(v==='home')home();if(v==='words')wordsView();if(v==='guide')guideView();if(v==='report')reportView()}
function bindCommon(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>startDay(b.dataset.day));document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>chooseProfile(b.dataset.profile));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{guideTab=b.dataset.guide;document.querySelectorAll('[data-guide]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#guide-example').innerHTML=guideExample()});bindSounds()}
$('#home').onclick=home;$('#words-nav').onclick=wordsView;$('#report-nav').onclick=reportView;$('#profile-nav').onclick=modalProfiles;
save();home();
</script>
