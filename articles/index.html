:root{--paper:#f9f8f4;--white:#fff;--ink:#202629;--muted:#606771;--line:#dedfdf;--blue:#3654ed;--pale:#edf1ff;--green:#167452;--red:#a93630;--orange:#9f452a;color-scheme:light;font-synthesis:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Onest,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}button,a,summary,input{touch-action:manipulation}
button{border:1px solid #cfd2d7;border-radius:28px;background:white;cursor:pointer;min-height:46px;padding:11px 22px;line-height:1.4;font-size:14px;font-weight:550;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:var(--pale)}button:disabled{cursor:default;opacity:.55}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #7086fc;outline-offset:4px}
button.primary{background:var(--blue);color:white;border-color:var(--blue);padding:12px 24px}button.primary:hover:not(:disabled){background:#2441d4;color:white;border-color:#2441d4}
button.quiet{border-color:transparent;background:var(--pale);color:var(--blue)}button.text-btn{border:0;background:none;padding:9px 4px;font-size:13px;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
a{color:var(--blue);text-underline-offset:4px}strong,b{font-weight:650}
h1,h2,h3,p{overflow-wrap:break-word}
h1{font-size:clamp(30px,3.4vw,43px);line-height:1.18;letter-spacing:-.045em;font-weight:650;margin:9px 0 17px}
h2{font-size:25px;line-height:1.35;letter-spacing:-.025em;font-weight:600;margin:0 0 16px}
p{margin:0 0 18px}.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:880px}
.small{font-size:14px;color:var(--muted);line-height:1.75}.eyebrow{font-size:12px;letter-spacing:.065em;font-weight:650;color:var(--blue);margin:0 0 10px}
.skip{position:absolute;top:-90px;left:15px;background:white;padding:10px;z-index:5}.skip:focus{top:10px}
.top{min-height:74px;padding:14px max(24px,calc((100% - 1132px)/2));display:flex;align-items:center;gap:30px;background:white;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:650;letter-spacing:.045em;white-space:nowrap}
.brand>b{display:grid;place-items:center;width:37px;height:37px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;line-height:1;letter-spacing:-.07em;padding-bottom:3px}
.course-caption{font-size:14px;color:var(--muted)}.header-actions{margin-left:auto;display:flex;align-items:center;gap:20px}.lesson-link{font-size:14px;text-decoration:none;color:var(--ink)}
#aid-open{font-size:14px;white-space:nowrap}
.layout{max-width:1180px;margin:auto;padding:0 24px}
.navigation{padding-top:25px}.day-line{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px}
.day-line>p{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.025em;margin:0}.save-note{color:var(--muted);font-size:12px}
#route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line);gap:7px}
#route button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:13px 8px 15px;min-width:0;line-height:1.4;font-size:13px;color:var(--muted);font-weight:400}
#route button:hover{background:var(--pale)}#route button[aria-current=step]{border-bottom-color:var(--blue);color:var(--blue);font-weight:600}
#route button>span:last-child{min-width:0;overflow-wrap:anywhere}.route-number{font-size:11px;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums}#route [aria-current=step] .route-number{color:var(--blue)}
#route small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}#route .route-done .route-number{color:var(--green)}
.work{min-width:0}.progress-line{display:flex;align-items:center;gap:15px;margin:22px 0 27px}
#bar{width:100%;height:3px;flex:1;overflow:hidden;background:#e4e7f1;border-radius:3px}#bar span{display:block;height:100%;background:var(--blue)}
#progress-text{font-size:12px;color:var(--muted);white-space:nowrap}
main{outline:none;min-height:55vh;padding-bottom:30px}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:65px;align-items:center;padding:12px 0 35px;border-bottom:1px solid var(--line);margin-bottom:30px}
.hero h1{font-size:clamp(36px,3.7vw,48px);line-height:1.14;max-width:650px;margin:12px 0 20px}.hero em{font-style:normal;color:var(--blue)}
.hero .lead{font-size:20px;color:var(--ink);line-height:1.6}.hero p:not(.lead):not(.eyebrow){font-size:15px;color:var(--muted);max-width:560px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.hero-meta span{padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--muted)}
.lesson-card{background:var(--blue);border-radius:8px;padding:28px 32px;color:white}.card-label{display:block;font-size:11px;letter-spacing:.06em;margin-bottom:7px;color:#edf1ff}
.card-rule{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:19px 0;border-bottom:1px solid #ffffff45}.card-rule:last-child{border:0;padding-bottom:2px}
.card-rule strong{font-size:42px;line-height:1.1;font-weight:550;letter-spacing:-.04em;white-space:nowrap}.card-rule span{font-size:13px;line-height:1.5;max-width:125px}
.intro-guide{padding:0 0 10px}.intro-guide>p:not(.eyebrow){font-size:16px;max-width:850px}
.intro-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:24px 0 22px;border-bottom:1px solid var(--line)}
.intro-tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:12px 6px 15px;text-align:left;font-size:15px;color:var(--muted)}
.intro-tabs button[aria-pressed=true]{border-bottom-color:var(--blue);color:var(--blue);font-weight:600}
.meaning{display:grid;grid-template-columns:1fr 160px;gap:35px;align-items:center;background:var(--pale);border-radius:8px;padding:30px 34px}
.meaning>div{min-width:0}.meaning-label{font-size:37px;line-height:1.2;letter-spacing:-.025em;font-weight:550;color:var(--blue)}
.meaning .en{margin:16px 0 8px}.meaning p:not(.en):not(.translation):not(.small){font-size:17px;max-width:800px}.meaning .small{margin:0;max-width:800px}
.meaning .objects{background:#ffffff8c;border-radius:50%;min-height:160px}.meaning .photo{width:142px;height:142px}
mark{color:var(--blue);background:#dbe2ff;border-radius:4px;padding:0 5px}
.en{font-size:clamp(28px,3.6vw,43px);line-height:1.35;font-weight:500;letter-spacing:-.035em;margin:16px 0 12px}
.translation{font-size:16px;line-height:1.6;color:var(--muted);margin:6px 0 22px}.mini-note{border-left:3px solid #b5c1ec;padding:12px 19px;margin:23px 0;font-size:15px;line-height:1.7}
.objects{display:flex;justify-content:center;gap:5px;align-items:center;min-height:130px}
.photo{position:relative;display:inline-block;overflow:hidden;isolation:isolate;flex-shrink:0;width:120px;height:120px;vertical-align:middle}
.photo img{position:absolute;width:400%;height:200%;max-width:none;object-fit:fill;pointer-events:none}
.resume{display:flex;justify-content:space-between;align-items:center;gap:25px;background:var(--pale);border-radius:7px;padding:22px 25px;margin:0 0 29px}.resume p{font-size:15px;margin:0}
details{border-top:1px solid var(--line);margin:22px 0;padding:18px 0}summary{cursor:pointer;font-weight:550;line-height:1.6;color:var(--blue)}details>p{margin-top:16px}
.brief{padding:17px 22px;border:1px solid #dce2f2;border-radius:7px;background:#f0f3fc;margin:25px 0 30px}
.brief summary{font-size:15px}.brief>p{font-size:16px;line-height:1.75}.brief>p:last-child{margin-bottom:0}.brief .small{font-size:14px}
.model{border-left:3px solid #b5c1ec;padding:8px 18px;margin:23px 0;background:transparent}
.model>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.model p{font-size:16px;margin:0;line-height:1.75}.model p.en{font-size:29px;margin:0 0 10px}
.task{padding:3px 0 0;border:0;background:transparent}.task-top{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:13px;color:var(--blue);font-size:12px;font-weight:600;letter-spacing:.035em}
.how{font-size:14px;border-left:3px solid #b5c1ec;padding:4px 18px;margin:24px 0;color:var(--muted);max-width:960px}.how strong{color:var(--ink);font-size:15px;font-weight:550}.how p{margin:5px 0 0;line-height:1.7}
.context{font-size:19px;line-height:1.7;max-width:950px;margin:24px 0 19px}
.chat-scene{display:flex;align-items:center;gap:25px;margin:23px 0}.chat-avatar{display:none}
.chat-message{min-width:0;flex:1;border-left:3px solid var(--blue);padding:17px 24px 20px;background:white;border-radius:0 6px 6px 0}
.speaker{font-size:12px;color:var(--blue);letter-spacing:.03em}.chat-message .en{margin:10px 0 6px}.chat-message .translation{margin:9px 0 0}

const guideEscape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
